# mise CI — the proper, shared reusable workflow (the only kind of CI in the fleet).
# Validates joeblew999/.github @main (unversioned/rolling) as a consumer: runs
# `mise run ci`, which exercises the shared tasks. Quick: one OS, no Rust build.
name: mise CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@main
    with:
      task: ci
      os-matrix: '["ubuntu-latest"]'
      sccache: false
