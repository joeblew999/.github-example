# mise CI — the shared reusable workflow (the fleet's only CI mechanism).
# Runs ONE shared task from .github; invents nothing. ubuntu-only, no build = quick.
name: mise CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@main
    with:
      task: ci:check-global   # a SHARED guard task — needs no repo code
      os-matrix: '["ubuntu-latest"]'
      sccache: false
