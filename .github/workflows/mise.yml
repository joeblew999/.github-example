name: mise CI

# Calls the shared reusable-mise-ci workflow to run one mise task across the OS
# matrix. Generated by `mise run mise:repo:bootstrap` — do not hand-edit; re-run to update.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@main
    with:
      task: ci
      os-matrix: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      sccache: false
