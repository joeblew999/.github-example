# validate — the CI half of the .github dev loop.
#
# Locally, .github-example includes ../.github by local path (a sibling dir).
# A CI runner has no sibling, so we check out BOTH repos side-by-side under the
# workspace (via `path:`), reproducing the local layout, then run the SAME tasks.
# Result: a change to .github (main, UNVERSIONED) is proven in CI here, matching
# what you ran locally — "works in both".
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      github_ref:
        description: ".github ref to validate (branch/tag; default main = unversioned latest)"
        type: string
        default: main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this sandbox
        uses: actions/checkout@v4
        with:
          path: .github-example

      - name: Checkout .github as a SIBLING (so ../.github resolves, like local)
        uses: actions/checkout@v4
        with:
          repository: joeblew999/.github
          ref: ${{ github.event.inputs.github_ref || 'main' }}
          path: .github

      - uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: Validate against the local (unversioned) .github
        working-directory: .github-example
        run: |
          mise trust
          mise run mise:global       # installs the global toolset (nushell, git-cliff, …)
          mise run demo:pack         # exercises the shared release:pack end-to-end
          mise run ci:check-global   # a shared guard task actually runs
