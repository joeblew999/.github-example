#:schema https://mise.jdx.dev/schema/mise.json
# .github-example — a MINIMAL, canonical consumer of joeblew999/.github.
#
# It only WIRES UP .github; it invents nothing. Tasks come from the includes,
# skills come from the .github marketplace — .github is the single source of
# truth. Pinned to `main` (rolling/unversioned) so it validates the latest
# .github with no release; real repos pin a tag (`?ref=vX`).

[task_config]
includes = [
  "git::https://github.com/joeblew999/.github.git//tasks/mise.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/ci.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-rust.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-docker.toml?ref=main",
]

[tools]
# Repo-specific tools only — global tools come from `mise run mise:global:bootstrap`.
# Rust is owned by rust-toolchain.toml (rustup), NEVER here — `ci:check-global`
# enforces it. The `rust:*` tasks (from tool-rust.toml) just call cargo.

# ── THE control panel ─────────────────────────────────────────────────────────
# `depends` is the lever: it lists what `mise run ci` runs — the SAME single
# command on your machine and on the GitHub matrix. Add a task → it runs; remove
# it → it doesn't. Each task self-skips where it can't run (docker on a Mac runner,
# etc.), so the list stays green on every OS.
#   bootstrap-check — re-runs `mise:repo:bootstrap` + fails if the generated CI
#                     workflows drifted (exercises the FULL onboarding flow)
#   test       — this repo's nushell smoke check
#   rust:test  — cargo test (compiles the binary for THIS OS — so the matrix
#                builds linux+macOS+windows binaries; `--os-matrix` at bootstrap
#                picks which OSes)
#   docker:build — builds the Dockerfile where a linux daemon exists, else skips
# (Publishing real binaries/images is a SEPARATE opt-in: `mise run
#  mise:repo:bootstrap --release`, which runs on a git tag — not on every push.)
[tasks.ci]
depends = ["bootstrap-check", "test", "rust:test", "docker:build"]

# Optional: control WHERE docker:build runs. Default (unset) = build wherever a
# linux daemon exists (here: local Docker Desktop + the ubuntu matrix cell). The
# single `mise run ci` command is unchanged either way — only this value moves.
#   [env]
#   DOCKER_BUILD = "ci"      # remote-only (local `mise run ci` skips docker)
#   # also: "local" (local-only) · "never" · "auto" (default)

# Exercise the FULL onboarding flow on every `ci` (local AND matrix): regenerate
# the workflow stubs from the shared `mise:repo:bootstrap` and FAIL if they drift
# from what's committed. This keeps the example a TRUE reference — its generated CI
# can never go stale vs the current bootstrap task, and bootstrap itself is tested
# on every push, not just when someone remembers. (.gitattributes pins eol=lf so
# the git compare is identical on Windows.)
[tasks.bootstrap-check]
run = '''
#!/usr/bin/env nu
def main [] {
  ^mise run mise:repo:bootstrap
  let dirty = (^git status --porcelain .github/workflows | str trim)
  if ($dirty | is-not-empty) {
    print --stderr "✗ .github/workflows/ drifted from `mise run mise:repo:bootstrap` — re-bootstrap and commit:"
    ^git --no-pager diff -- .github/workflows
    exit 1
  }
  print "✓ workflows in sync with mise:repo:bootstrap"
}
'''

# Proves TWO mechanisms the .github tasks rely on, isomorphically on every OS:
#   1. per-task `tools = {}` auto-install — yq is NOT in the global toolset.
#   2. orchestration→primitive composition via `mise run` stdout capture — the
#      exact pattern cf/provision use (provision:* capture cf:* output).
[tasks.test]
tools = { yq = "latest" }
run = '''
#!/usr/bin/env nu
let yqv = (^yq --version | str trim)
let composed = (^mise run compose-probe | complete | get stdout | str trim)
if $composed != "COMPOSED-OK" {
  print --stderr $"✗ mise-run composition broken — captured [($composed)]"
  exit 1
}
print $"✓ example test — ($nu.os-info.name); per-task yq ok; compose via mise run = ($composed)"
'''

# A trivial PRIMITIVE the test composes — same mise-run capture pattern as provision:*→cf:*.
[tasks.compose-probe]
run = '''
#!/usr/bin/env nu
print "COMPOSED-OK"
'''
