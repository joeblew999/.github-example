#:schema https://mise.jdx.dev/schema/mise.json
# .github-example — a MINIMAL, canonical consumer of joeblew999/.github.
#
# It only WIRES UP .github; it invents nothing. Tasks come from the includes,
# skills come from the .github marketplace — .github is the single source of
# truth. Pinned to `main` (rolling/unversioned) so it validates the latest
# .github with no release; real repos pin a tag (`?ref=vX`).

[task_config]
includes = [
  "git::https://github.com/joeblew999/.github.git//tasks/mise.toml?ref=main",
  "git::https://github.com/joeblew999/.github.git//tasks/ci.toml?ref=main",
]

[tools]
# Repo-specific tools only — global tools come from `mise run mise:global:bootstrap`.
# (Rust, if any, is pinned in rust-toolchain.toml — never here.)

# This repo's OWN CI work. `ci` from .github is the guard floor; a local `ci`
# that depends on our task MERGES with it, so `mise run ci` runs guards + this.
[tasks.ci]
depends = ["test"]

# Proves TWO mechanisms the .github tasks rely on, isomorphically on every OS:
#   1. per-task `tools = {}` auto-install — yq is NOT in the global toolset.
#   2. orchestration→primitive composition via `mise run` stdout capture — the
#      exact pattern cf/provision use (provision:* capture cf:* output).
[tasks.test]
tools = { yq = "latest" }
run = '''
#!/usr/bin/env nu
let yqv = (^yq --version | str trim)
let composed = (^mise run compose-probe | complete | get stdout | str trim)
if $composed != "COMPOSED-OK" {
  print --stderr $"✗ mise-run composition broken — captured [($composed)]"
  exit 1
}
print $"✓ example test — ($nu.os-info.name); per-task yq ok; compose via mise run = ($composed)"
'''

# A trivial PRIMITIVE the test composes — same mise-run capture pattern as provision:*→cf:*.
[tasks.compose-probe]
run = '''
#!/usr/bin/env nu
print "COMPOSED-OK"
'''
